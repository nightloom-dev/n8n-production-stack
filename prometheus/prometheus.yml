global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: [alertmanager:9093]}]

scrape_configs:
  - job_name: n8n
    static_configs:
      - targets: [main:5678, webhook:5678, worker-1:5678, worker-2:5678]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: backup
    honor_labels: true
    static_configs: [{targets: [pushgateway:9091]}]
  - job_name: monitoring
    static_configs: [{targets: [localhost:9090, alertmanager:9093]}]
